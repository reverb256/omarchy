name: niri-gate

# Downstream CI gate (design doc: "the fork builds quickshell-niri + lints
# the niri QML on every upstream merge before the cluster consumes it").
# Every push (including upstream sync rebases) builds both omarchy variants
# and runs the shell-niri drift check.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build omarchy (hyprland, pure upstream)
        run: nix build .#packages.x86_64-linux.omarchy

      - name: Build omarchy (niri, additive layer)
        run: nix build .#packages.x86_64-linux.omarchy-niri

      - name: Build quickshell-niri (quickshell + qml-niri)
        run: nix build .#packages.x86_64-linux.quickshell-niri

      - name: shell-niri drift check (variants shadow upstream)
        run: nix build .#checks.x86_64-linux.shell-niri-shadows-upstream
